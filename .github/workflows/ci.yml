name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        include:
          - node: 22
            coverage: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.node == 22
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Test with coverage
        if: matrix.coverage
        run: pnpm test:coverage

  pkg-managers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pm: [npm, yarn, pnpm, bun]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test with ${{ matrix.pm }}
        run: |
          ${{ matrix.pm }} install
          ${{ matrix.pm }} test
